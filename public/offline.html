<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دورهمی‌یار — آفلاین</title>
<link rel="stylesheet" href="/styles.css">
<style>
  body { display: grid; place-items: center; min-height: 100dvh; margin: 0; padding: 1.2rem; }
  .off { max-width: 30rem; text-align: center; padding: 2rem 1.4rem; }
  .off h1 { font-size: 1.35rem; margin: 0 0 .6rem; }
  .off p { line-height: 1.9; font-size: .92rem; }
  .seal { width: 84px; height: 84px; margin: 0 auto 1rem; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, #a8492f, #6d2318); color: #f6e3b7; font-size: 2rem;
    box-shadow: inset 0 -3px 8px rgba(0,0,0,.4), 0 6px 14px rgba(0,0,0,.45); }
</style>
</head>
<body class="paper">
  <main class="paper off">
    <div class="seal">د</div>
    <h1>فعلاً به شبکه دسترسی نیست</h1>
    <p>دورهمی‌یار برای اجرا به اینترنت نیاز ندارد؛ فقط کافی است یک‌بار با اتصال باز شده باشد تا همه‌ی بازی‌ها در حافظه‌ی دستگاه ذخیره شوند.</p>
    <p>اتصال را بررسی کن و دوباره تلاش کن.</p>
    <a class="btn btn--primary btn--block" href="/">تلاش دوباره</a>
  </main>
</body>
</html>
